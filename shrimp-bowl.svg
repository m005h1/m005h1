<svg width="300" height="300" viewBox="0 0 300 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bowlGradient" x1="0" y1="0" x2="300" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0f172a" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#134e4a" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="waterGradient" x1="150" y1="300" x2="150" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#14b8a6" stop-opacity="0.3"/>
      <stop offset="0.5" stop-color="#22d3ee" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur-md" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
    </filter>
    <filter id="blur-xl" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur"/>
    </filter>
    <clipPath id="bowlClip">
       <circle cx="150" cy="150" r="148"/>
    </clipPath>
  </defs>

  <circle cx="150" cy="150" r="148" fill="url(#bowlGradient)" stroke="#14b8a6" stroke-opacity="0.3" stroke-width="2"/>
  
  <g clip-path="url(#bowlClip)">
      <rect x="0" y="120" width="300" height="180" fill="url(#waterGradient)" filter="url(#blur-xl)"/>

      <ellipse cx="100" cy="80" rx="50" ry="20" fill="white" fill-opacity="0.2" filter="url(#blur-md)" transform="rotate(-45 100 80)"/>

      <circle cx="130" cy="200" r="3" fill="#a5f3fc" fill-opacity="0.6" filter="url(#blur-md)"/>
      <circle cx="170" cy="150" r="2" fill="#a5f3fc" fill-opacity="0.6" filter="url(#blur-md)"/>
      <circle cx="150" cy="250" r="2.5" fill="#a5f3fc" fill-opacity="0.6" filter="url(#blur-md)"/>

      <g transform="translate(50, 50) scale(2)">
        <g fill="none" stroke-linecap="round">
          <path d="M20,55 Q15,60 20,65 M20,60 H15" stroke="#2dd4bf" stroke-opacity="0.6" stroke-width="2"/>
          <path d="M25,60 Q35,50 50,55 T75,60" stroke="#14b8a6" stroke-width="5"/>
          <path d="M35,60 L35,68 M45,58 L45,66 M55,56 L55,64" stroke="#0d9488" stroke-width="1.5"/>
          <path d="M75,60 Q85,55 95,40" stroke="#67e8f9" stroke-opacity="0.8" stroke-width="0.5"/>
          <path d="M75,60 Q85,65 95,70" stroke="#67e8f9" stroke-opacity="0.8" stroke-width="0.5"/>
          <circle cx="72" cy="58" r="1.5" fill="#0f172a"/>
        </g>
      </g>
  </g>

  <path d="M100 14 A 145 145 0 0 1 290 150" stroke="white" stroke-opacity="0.3" stroke-width="2" fill="none"/>
  <path d="M14 100 A 145 145 0 0 0 150 290" stroke="white" stroke-opacity="0.1" stroke-width="2" fill="none"/>
</svg>